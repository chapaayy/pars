services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: newsroom
      POSTGRES_USER: newsroom
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsroom -d newsroom"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${DB_PASSWORD}@db:5432/newsroom
      DATA_DIR: /data
      PUBLIC_DOMAIN: ${DOMAIN}
      COOKIE_SECURE: "true"
    volumes:
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
    networks: [private]

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://newsroom:${DB_PASSWORD}@db:5432/newsroom
      DATA_DIR: /data
    volumes:
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [private]

networks:
  private:

volumes:
  app_data:
  db_data:
  caddy_data:
  caddy_config:

secrets:
  db_password:
    file: ./secrets/db_password
